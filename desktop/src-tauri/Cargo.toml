[package]
name = "rtbit-desktop"
edition = "2024"
version = "0.1.0-rc.3"
description = "rtbit torrent client"
license = ""
repository = ""

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-shell.workspace = true
tauri-plugin-notification = "2"
tauri-plugin-dialog = "~2.7.3"
tauri-plugin-single-instance = "~2.4.5"
tauri-plugin-deep-link = "~2.4.10"
tauri-plugin-autostart = "~2.5.1"
tauri-plugin-updater = { version = "~2.12.0", optional = true }
url = "2"
serde.workspace = true
serde_json.workspace = true
librtbit = { workspace = true, features = [
    "tracing-subscriber-utils",
    "http-api",
    "webui",
    "upnp-serve-adapter",
    "prometheus",
    "default-tls"
] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
anyhow.workspace = true
directories.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing.workspace = true
serde_with.workspace = true
parking_lot.workspace = true
gethostname.workspace = true
metrics-exporter-prometheus.workspace = true
librqbit-dualstack-sockets.workspace = true
reqwest = { workspace = true }
open = "5"

[features]
default = ["self-update"]
# In-app update check. Flatpak builds disable it: the sandbox forbids replacing
# the binary, and updates arrive through the Flatpak remote.
self-update = ["dep:tauri-plugin-updater"]
custom-protocol = ["tauri/custom-protocol"]
disable-upload = ["librtbit/disable-upload"]
