<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>rustTorrent</title>
    <style>
      /* Matches the web UI tokens: slate surfaces, rust-orange accent */
      :root {
        --surface: #f8fafc; /* slate-50 */
        --text: #0f172a; /* slate-900 */
        --muted: #475569; /* slate-600 */
        --track: #e2e8f0; /* slate-200 */
        --accent: #ea580c; /* orange-600 */
        --button: #c2410c; /* orange-700: white text clears 4.5:1 */
        --button-hover: #9a3412; /* orange-800 */
        --on-button: #ffffff;
        --error: #b91c1c; /* red-700 */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #0f172a; /* slate-900 */
          --text: #f1f5f9; /* slate-100 */
          --muted: #94a3b8; /* slate-400 */
          --track: #334155; /* slate-700 */
          --accent: #fb923c; /* orange-400 */
          --button: #fb923c; /* orange-400 with dark text */
          --button-hover: #fdba74; /* orange-300 */
          --on-button: #0f172a;
          --error: #fca5a5; /* red-300 */
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--surface);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--track);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: pulse 2s ease-in-out infinite;
        }
      }
      .status {
        font-size: 14px;
        color: var(--muted);
      }
      .failed .status {
        color: var(--error);
        font-weight: 600;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        max-width: 28rem;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 6px 16px;
        border: 0;
        border-radius: 6px;
        background: var(--button);
        color: var(--on-button);
        cursor: pointer;
      }
      button:hover {
        background: var(--button-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <div class="status" id="status" role="status" aria-live="polite">
      Starting the rustTorrent engine…
    </div>
    <p class="hint" id="hint" hidden>
      Run <code>rtbit-desktop</code> from a terminal to see the engine log. A
      port conflict on 127.0.0.1:3030 is the usual cause.
    </p>
    <button type="button" id="retry" hidden>Retry</button>
    <script>
      // Only the local engine is contacted; never add another host here.
      const ENGINE = "http://127.0.0.1:3030";
      const FAIL_AFTER_MS = 20000;
      const POLL_MS = 200;

      const spinner = document.getElementById("spinner");
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");
      const retry = document.getElementById("retry");

      let attempt = 0;

      function showStarting() {
        document.body.classList.remove("failed");
        spinner.hidden = false;
        hint.hidden = true;
        retry.hidden = true;
        status.textContent = "Starting the rustTorrent engine…";
      }

      function showFailed() {
        document.body.classList.add("failed");
        spinner.hidden = true;
        hint.hidden = false;
        retry.hidden = false;
        status.textContent = "The rustTorrent engine didn't start";
        retry.focus();
      }

      function poll() {
        const current = ++attempt;
        showStarting();
        const failTimer = setTimeout(() => {
          if (current === attempt) {
            attempt++; // stop this poll loop
            showFailed();
          }
        }, FAIL_AFTER_MS);

        (async () => {
          while (current === attempt) {
            try {
              const r = await fetch(`${ENGINE}/stats`);
              if (r.ok && current === attempt) {
                clearTimeout(failTimer);
                window.location.href = `${ENGINE}/web/`;
                return;
              }
            } catch {}
            await new Promise((r) => setTimeout(r, POLL_MS));
          }
        })();
      }

      retry.addEventListener("click", poll);
      poll();
    </script>
  </body>
</html>
