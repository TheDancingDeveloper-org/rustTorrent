name: Container publication

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rusttorrent-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Privileged publication capacity is selected only for this repository and
    # this workflow deliberately has no pull_request trigger.
    runs-on: [self-hosted, docker, publish]
    env:
      IMAGE: ghcr.io/thedancingdeveloper-org/rusttorrent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Define immutable and compatibility tags
        id: tags
        shell: bash
        run: |
          # Promotion flow: dev branch -> :dev (preview), main branch ->
          # :staging (promoted, pre-release). A v* tag is a release:
          #   vX.Y.Z-{alpha,beta,rc}.N -> :<tag> and :beta (soak; never :latest)
          #   vX.Y.Z                   -> :<tag> and :latest (stable or hotfix)
          # Every build also gets an immutable :sha-<commit> tag.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            case "$GITHUB_REF_NAME" in v[0-9]*) ;; *) exit 1 ;; esac
            case "$GITHUB_REF_NAME" in
              *-alpha*|*-beta*|*-rc*) moving=beta ;;
              *) moving=latest ;;
            esac
            printf 'tags=%s\n' "$IMAGE:$GITHUB_REF_NAME,$IMAGE:$moving,$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == main ]]; then
            printf 'tags=%s\n' "$IMAGE:staging,$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == dev ]]; then
            printf 'tags=%s\n' "$IMAGE:dev,$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "container publication is not configured for ref $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Build and publish the destination image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          # Max-mode provenance and an SBOM are attached to the pushed image
          # index, so consumers can verify how the image was built.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: ''
          cache-to: ''
      # GitHub does not expose a supported REST mutation for package
      # visibility. The package is made public once during repository
      # bootstrap; this anonymous pull is the fail-closed enforcement.
      - name: Verify the anonymous destination manifest
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; elif [[ "$GITHUB_REF_NAME" == main ]]; then tag=staging; else tag=dev; fi
          token=$(curl -fsS 'https://ghcr.io/token?service=ghcr.io&scope=repository:thedancingdeveloper-org/rusttorrent:pull' | jq -r .token)
          test -n "$token"
          curl -fsS -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/thedancingdeveloper-org/rusttorrent/manifests/$tag" > manifest.json
          jq -e '.schemaVersion == 2' manifest.json >/dev/null

  codeql-dev:
    # The :dev build is a release build, so it is scanned here once the image
    # is published. Tag pushes are scanned by codeql.yml's own trigger, and
    # main's :staging builds are not scanned. See docs/ci.md.
    needs: publish
    if: github.ref_type == 'branch' && github.ref_name == 'dev'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      ref: ${{ github.sha }}
