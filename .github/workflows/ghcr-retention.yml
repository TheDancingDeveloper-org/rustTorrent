name: GHCR retention policy

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed dry-run plan
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  packages: write

jobs:
  retention:
    uses: TheDancingDeveloper-org/github-policy/.github/workflows/ghcr-retention-reusable.yml@48b48161921f236d0086231f8f28ccc8fa8c5cef # main
    with:
      packages: "rusttorrent"
      apply: ${{ inputs.apply || false }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
