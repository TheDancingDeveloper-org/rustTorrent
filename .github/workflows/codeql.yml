name: CodeQL

# Code scanning runs only when a release build is cut, never on pull requests,
# the merge queue or pushes to main. It is triggered three ways:
#   - a `v*` tag push (a pre-release or a stable tag pushed by hand);
#   - a call from container.yml for the :dev build (the commit SHA is passed);
#   - a call from promote-release.yml for the stable tag, which is created with
#     the workflow token and so fires no push event of its own.
# `workflow_dispatch` is for a manual run. See docs/ci.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch to scan (default is the triggering ref)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Commit SHA, tag or branch to scan (default is the caller's ref)
        required: false
        type: string
        default: ''

# Read-only by default. Only the analyze job adds security-events, to upload
# the SARIF results.
permissions:
  contents: read

concurrency:
  # Per scanned ref. A release analysis is never cancelled by a later one.
  group: codeql-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: [self-hosted]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
