name: CodeQL

# Code scanning runs only for tagged releases or a manual dispatch, never on
# pull requests, the merge queue or pushes to a branch. It is triggered two
# ways:
#   - a `v*` tag push (a pre-release or a stable tag pushed by hand);
#   - a call from promote-release.yml for the stable tag, which is created with
#     the workflow token and so fires no push event of its own.
# `workflow_dispatch` is for a manual run, including a dev build. See docs/ci.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to scan (default is the triggering ref)
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Branch or tag to scan (default is the caller's ref)
        required: false
        type: string
        default: ''

# Read-only by default. Only the analyze job adds security-events, to upload
# the SARIF results.
permissions:
  contents: read

concurrency:
  # Per scanned ref. A release analysis is never cancelled by a later one.
  group: codeql-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: [self-hosted]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Record the checked-out commit
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve the ref to upload against
        id: target
        shell: bash
        env:
          RAW_REF: ${{ inputs.ref }}
          DEFAULT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          ref="${RAW_REF:-}"
          if [[ -z "$ref" ]]; then
            ref="$DEFAULT_REF"
          elif [[ "$ref" != refs/* ]]; then
            case "$ref" in
              heads/*|tags/*) ref="refs/$ref" ;;
              *)
                if git rev-parse --verify --quiet "refs/tags/$ref^{commit}" >/dev/null; then
                  ref="refs/tags/$ref"
                elif git rev-parse --verify --quiet "refs/remotes/origin/$ref^{commit}" >/dev/null; then
                  ref="refs/heads/$ref"
                elif git rev-parse --verify --quiet "refs/heads/$ref^{commit}" >/dev/null; then
                  ref="refs/heads/$ref"
                else
                  echo "ref must be a branch or tag name, or a full refs/... ref: $ref" >&2
                  exit 1
                fi
                ;;
            esac
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          ref: ${{ steps.target.outputs.ref }}
          sha: ${{ steps.head.outputs.sha }}
