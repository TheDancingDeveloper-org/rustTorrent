name: Migration policy

on:
  push:
    # The queue pushes gh-readonly-queue/main/* refs; its merge_group run covers them.
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    # Fork pull requests must not reach self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify migration policies
        shell: bash
        run: bash ci/migration-policy.sh
