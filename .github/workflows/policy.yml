name: Migration policy

on:
  push:
    # The queue pushes gh-readonly-queue/main/* refs; its merge_group run covers them.
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: [self-hosted, linux]
    steps:
      # Required check: a skipped job would count as passing, so fork pull
      # requests fail here instead, before any fork code is checked out.
      - name: Refuse fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests do not run on self-hosted runners. Push the branch to this repository to get policy checks."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify migration policies
        shell: bash
        run: bash ci/migration-policy.sh
      - name: Detect dependency policy changes
        id: dependency-policy
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- Cargo.lock ':(glob)**/Cargo.toml' deny.toml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        if: github.event_name != 'pull_request' || steps.dependency-policy.outputs.run == 'true'
        with:
          tool: cargo-deny@0.20.2
      - name: Verify Rust dependency policy
        if: github.event_name != 'pull_request' || steps.dependency-policy.outputs.run == 'true'
        run: cargo deny check advisories licenses bans sources
