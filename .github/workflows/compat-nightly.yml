name: Compat nightly

# Container-backed WebUI API v2 compatibility checks, too heavy for per-PR CI:
#
# - qbit-diff: replays the client fixtures against a real qBittorrent and the
#   latest main image, diffing responses field by field (scripts/qbit-diff/).
# - sonarr-e2e: brings up Sonarr next to rustTorrent and has Sonarr test and
#   save rustTorrent as its qBittorrent download client (tests/sonarr-e2e/).
#
# The in-process replay of the same fixtures runs per-PR with the unit tests.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      rtbit_image:
        description: rustTorrent image to test
        default: ghcr.io/thedancingdeveloper-org/rusttorrent:staging
      strict_diff:
        description: Fail the run when qbit-diff finds differences
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: compat-nightly
  cancel-in-progress: true

env:
  RTBIT_IMAGE: ${{ inputs.rtbit_image || 'ghcr.io/thedancingdeveloper-org/rusttorrent:staging' }}

jobs:
  qbit-diff:
    runs-on: [self-hosted, docker]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Diff against real qBittorrent
        shell: bash
        env:
          QBIT_DIFF_PROJECT: qbitdiff-${{ github.run_id }}
          STRICT: ${{ inputs.strict_diff && 'true' || 'false' }}
        run: |
          # Known parity gaps are reported, not failed, until the diff is clean;
          # dispatch with strict_diff to gate on it.
          extra=()
          [ "$STRICT" = true ] || extra+=(--report-only)
          scripts/qbit-diff/run.sh qbit-diff-report.md "${extra[@]}"
      - name: Publish report
        if: always()
        shell: bash
        run: |
          [ -f qbit-diff-report.md ] && cat qbit-diff-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qbit-diff-report
          path: qbit-diff-report.md
          if-no-files-found: ignore

  sonarr-e2e:
    runs-on: [self-hosted, docker]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sonarr adds rustTorrent as a download client
        shell: bash
        env:
          SONARR_E2E_PROJECT: sonarr-e2e-${{ github.run_id }}
          # Off the defaults so a developer stack on the runner host is untouched.
          RTBIT_PORT: '28931'
          RTBIT_BT_PORT: '28941'
          SONARR_PORT: '28989'
          RTBIT_DOWNLOADS: ${{ runner.temp }}/sonarr-e2e/downloads
          RTBIT_COMPLETED: ${{ runner.temp }}/sonarr-e2e/completed
          SONARR_TV: ${{ runner.temp }}/sonarr-e2e/tv
        run: tests/sonarr-e2e/run.sh
