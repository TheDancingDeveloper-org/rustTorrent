name: Release binaries

on:
  push:
    tags: ['v*']
  # Manual re-publish of an existing tag, and the stable-release step of
  # promote-release.yml, which calls this workflow once the stable tag exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

# Read-only by default. Each job widens only what it needs, so the OIDC token
# (id-token) is minted only in the signing job and the write token only in
# the publishing job.
permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted]
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
      - name: Install release toolchain
        shell: bash
        run: |
          apt-get update
          apt-get install -y gcc-mingw-w64-x86-64 nasm golang-go
          # nfpm is pinned; it builds both the .deb and the .rpm.
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-gnu
      - name: Build Linux, Debian and RPM artifacts
        shell: bash
        run: |
          export CARGO_PROFILE_RELEASE_GITHUB_LTO=fat
          export CARGO_PROFILE_RELEASE_GITHUB_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_GITHUB_STRIP=symbols
          cargo build --profile release-github -p rtbit --no-default-features --features default-tls
          tag="${{ inputs.tag || github.ref_name }}"
          export VERSION="${tag#v}" ARCH=amd64 BINARY=target/release-github/rtbit
          nfpm package --packager deb --config packaging/linux/nfpm.yaml --target target/release-github/rtbit_amd64.deb
          nfpm package --packager rpm --config packaging/linux/nfpm.yaml --target target/release-github/rtbit-x86_64.rpm
      - name: Build Windows artifact
        shell: bash
        run: |
          export CARGO_PROFILE_RELEASE_GITHUB_LTO=fat
          export CARGO_PROFILE_RELEASE_GITHUB_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_GITHUB_STRIP=symbols
          cargo build --profile release-github -p rtbit --target x86_64-pc-windows-gnu --no-default-features --features default-tls
      - name: Stage and checksum artifacts
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          test -n "$tag"
          rm -rf release-artifacts
          mkdir release-artifacts
          cp target/release-github/rtbit "release-artifacts/rtbit-$tag-linux-x86_64"
          cp target/x86_64-pc-windows-gnu/release-github/rtbit.exe "release-artifacts/rtbit-$tag-windows-x86_64.exe"
          cp target/release-github/rtbit_amd64.deb "release-artifacts/rtbit-$tag-amd64.deb"
          cp target/release-github/rtbit-x86_64.rpm "release-artifacts/rtbit-$tag-x86_64.rpm"
          (cd release-artifacts && sha256sum rtbit-*) > "release-artifacts/SHA256SUMS-$tag.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  sign:
    # Only this job can mint the OIDC token used for the provenance attestation
    # and the keyless cosign signature.
    needs: build
    runs-on: [self-hosted]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/rtbit-*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS (keyless)
        shell: bash
        run: |
          set -euo pipefail
          sums=$(ls release-artifacts/SHA256SUMS-*.txt)
          cosign sign-blob --yes \
            --output-signature "$sums.sig" \
            --output-certificate "$sums.pem" \
            "$sums"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-signed
          path: release-artifacts/
          if-no-files-found: error

  # Gates publish: the signed checksum file must verify and every artefact in
  # it must match before anything is uploaded. Channel renders (AUR, Homebrew,
  # winget, Flatpak) hang off this job as further steps.
  channels:
    needs: sign
    runs-on: [self-hosted]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts-signed
          path: release-artifacts/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify SHA256SUMS signature and artefact digests
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          test -n "$tag"
          packaging/scripts/verify-release.sh "$tag" release-artifacts

  publish:
    needs: [build, sign, channels]
    runs-on: [self-hosted]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts-signed
          path: release-artifacts/
      - name: Set release tag
        id: artifacts
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          test -n "$tag"
          # Pre-releases (-alpha/-beta/-rc) are GitHub pre-releases and never
          # move the download host's `latest` link, matching container.yml.
          case "$tag" in
            *-alpha*|*-beta*|*-rc*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Publish download artifacts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pinned host key(s) for the download host, one known_hosts line per
          # key. Repo secret; the host key is never learned at run time.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # Dedicated non-root account on the download host. The operator
          # creates it, authorises the key in DEPLOY_SSH_KEY, and makes
          # DEPLOY_DIR writable by it.
          DEPLOY_USER: rusttorrent-deploy
          DEPLOY_HOST: 100.92.4.57
          DEPLOY_DIR: /srv/downloads/rusttorrent
        shell: bash
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          ssh_opts=(-i "$RUNNER_TEMP/ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          tag="${{ steps.artifacts.outputs.tag }}"
          ssh "${ssh_opts[@]}" "$target" "mkdir -p $DEPLOY_DIR/$tag"
          scp "${ssh_opts[@]}" release-artifacts/* "$target:$DEPLOY_DIR/$tag/"
          latest_link=""
          if [[ "${{ steps.artifacts.outputs.prerelease }}" == false ]]; then
            latest_link="&& ln -sfn $tag $DEPLOY_DIR/latest"
          fi
          ssh "${ssh_opts[@]}" "$target" "cd $DEPLOY_DIR/$tag && ln -sfn rtbit-$tag-linux-x86_64 rtbit-linux-x86_64 && ln -sfn rtbit-$tag-windows-x86_64.exe rtbit-windows-x86_64.exe $latest_link"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.artifacts.outputs.tag }}"
          notes="docs/releases/${tag}.md"
          # A checked-in notes file is used verbatim; a tag without one (such
          # as a promoted stable release) gets GitHub-generated notes.
          if test -f "$notes"; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          prerelease_args=()
          if [[ "${{ steps.artifacts.outputs.prerelease }}" == true ]]; then
            prerelease_args=(--prerelease)
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "rustTorrent $tag" "${notes_args[@]}" "${prerelease_args[@]}"
          fi
          gh release upload "$tag" release-artifacts/* --clobber
