name: Release binaries

on:
  push:
    tags: ['v*']
  # Manual re-publish of an existing tag, and the stable-release step of
  # promote-release.yml, which calls this workflow once the stable tag exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

# Read-only by default. Each job widens only what it needs, so the OIDC token
# (id-token) is minted only in the signing job and the write token only in
# the publishing job.
permissions:
  contents: read

jobs:
  build:
    # `.github/workflows/release-dry-run.yml` mirrors this job without
    # publishing, and runs nightly and on PRs that touch release tooling. Keep
    # the toolchain, the profile environment and the artefact names in step.
    # Each target's profile environment is exported in its own step, so one
    # target's flags never reach the other build.
    runs-on: [self-hosted, rust-heavy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
      - name: Install release toolchain
        shell: bash
        run: |
          apt-get update
          apt-get install -y gcc-mingw-w64-x86-64 nasm golang-go
          # nfpm is pinned; it builds both the .deb and the .rpm.
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          rustup target add x86_64-pc-windows-gnu
      - name: Build Linux, Debian and RPM artifacts
        shell: bash
        run: |
          export CARGO_PROFILE_RELEASE_GITHUB_LTO=fat
          export CARGO_PROFILE_RELEASE_GITHUB_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_GITHUB_STRIP=symbols
          cargo build --profile release-github -p rtbit --no-default-features --features default-tls
          tag="${{ inputs.tag || github.ref_name }}"
          export VERSION="${tag#v}" ARCH=amd64 BINARY=target/release-github/rtbit
          nfpm package --packager deb --config packaging/linux/nfpm.yaml --target target/release-github/rtbit_amd64.deb
          nfpm package --packager rpm --config packaging/linux/nfpm.yaml --target target/release-github/rtbit-x86_64.rpm
      - name: Build Windows artifact
        shell: bash
        run: |
          export CARGO_PROFILE_RELEASE_GITHUB_LTO=fat
          export CARGO_PROFILE_RELEASE_GITHUB_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_GITHUB_STRIP=symbols
          cargo build --profile release-github -p rtbit --target x86_64-pc-windows-gnu --no-default-features --features default-tls
      # The native client (crates/rtbit-egui). Linux builds in a pinned
      # container with the wayland/X11/GL -dev packages, Windows cross-builds
      # with cargo-zigbuild; see packaging/scripts/build-egui.sh. Neither
      # changes the shared runner's apt or dpkg state.
      - name: Build native client artifacts
        shell: bash
        run: |
          export CARGO_PROFILE_RELEASE_GITHUB_LTO=fat
          export CARGO_PROFILE_RELEASE_GITHUB_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_GITHUB_STRIP=symbols
          tag="${{ inputs.tag || github.ref_name }}"
          test -n "$tag"
          rm -rf target/egui-stage
          bash packaging/scripts/build-egui.sh linux "$tag" target/egui-stage
          bash packaging/scripts/build-egui.sh windows "$tag" target/egui-stage
          bash packaging/scripts/build-egui.sh sbom "$tag" target/egui-stage
      - name: Stage and checksum artifacts
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          test -n "$tag"
          rm -rf release-artifacts
          mkdir release-artifacts
          cp target/release-github/rtbit "release-artifacts/rtbit-$tag-linux-x86_64"
          cp target/x86_64-pc-windows-gnu/release-github/rtbit.exe "release-artifacts/rtbit-$tag-windows-x86_64.exe"
          cp target/release-github/rtbit_amd64.deb "release-artifacts/rtbit-$tag-amd64.deb"
          cp target/release-github/rtbit-x86_64.rpm "release-artifacts/rtbit-$tag-x86_64.rpm"
          # Unit files, sysusers entry and default config, laid out at their
          # install paths. The AUR package unpacks this as-is.
          stage=$(mktemp -d)
          install -Dm644 packaging/linux/rtbit.service "$stage/usr/lib/systemd/system/rtbit.service"
          install -Dm644 systemd/rtbit.service "$stage/usr/lib/systemd/user/rtbit.service"
          install -Dm644 systemd/rtbit.socket "$stage/usr/lib/systemd/user/rtbit.socket"
          install -Dm644 packaging/linux/rtbit.sysusers.conf "$stage/usr/lib/sysusers.d/rtbit.conf"
          install -Dm644 systemd/rtbit.conf "$stage/etc/rtbit/rtbit.conf"
          tar --owner=0 --group=0 --numeric-owner -C "$stage" -czf "release-artifacts/rtbit-$tag-service-files.tar.gz" .
          # Vendored crates for the offline Flatpak build. cargo vendor prints
          # the source-replacement config, which goes beside vendor/ so that
          # extracting at the repository root gives a working tree.
          vendor_stage=$(mktemp -d)
          mkdir -p "$vendor_stage/.cargo"
          cargo vendor --locked vendor > "$vendor_stage/.cargo/config.toml"
          mv vendor "$vendor_stage/vendor"
          tar --owner=0 --group=0 --numeric-owner -C "$vendor_stage" -cJf "release-artifacts/rtbit-$tag-vendor.tar.xz" .
          # CycloneDX SBOM of the rtbit crate graph, built with the release
          # features. Its rtbit-* name puts it under SHA256SUMS, the
          # provenance attestation and the cosign signature.
          cargo install --locked cargo-cyclonedx --version 0.5.7 --root "$RUNNER_TEMP/cyclonedx"
          "$RUNNER_TEMP/cyclonedx/bin/cargo-cyclonedx" cyclonedx \
            --manifest-path crates/rtbit/Cargo.toml \
            --no-default-features --features default-tls \
            --format json --spec-version 1.5 \
            --override-filename rtbit-sbom
          mv crates/rtbit/rtbit-sbom.json "release-artifacts/rtbit-$tag-sbom.cdx.json"
          # Native client binaries, .deb and SBOM, named rtbit-egui-<tag>-*.
          cp target/egui-stage/rtbit-egui-* release-artifacts/
          (cd release-artifacts && sha256sum rtbit-*) > "release-artifacts/SHA256SUMS-$tag.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  sign:
    # Only this job can mint the OIDC token used for the provenance attestation
    # and the keyless cosign signature.
    needs: build
    runs-on: [self-hosted]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts/
      - name: Ensure osslsigncode is available
        shell: bash
        run: |
          if command -v osslsigncode >/dev/null 2>&1; then
            exit 0
          fi
          sudo=""
          if [[ "$(id -u)" != 0 ]]; then
            sudo="sudo -n"
          fi
          if ! { $sudo apt-get update -qq && $sudo apt-get install -y --no-install-recommends osslsigncode; }; then
            echo "::error::osslsigncode is missing and could not be installed; add it to the runner image"
            exit 1
          fi
      # Authenticode-sign the .exe with an RFC 3161 timestamp before anything
      # hashes it: this rewrites SHA256SUMS so the attestation and the cosign
      # signature below both cover the signed bytes.
      - name: Authenticode-sign the Windows executable
        env:
          RUSTTORRENT_AUTHENTICODE_PFX_B64: ${{ secrets.RUSTTORRENT_AUTHENTICODE_PFX_B64 }}
          RUSTTORRENT_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.RUSTTORRENT_AUTHENTICODE_PFX_PASSWORD }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          test -n "$tag"
          bash packaging/scripts/sign-windows.sh "$tag" release-artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/rtbit-*
      # cosign-installer runs envsubst, which the self-hosted runners may not have.
      - name: Ensure envsubst is available
        shell: bash
        run: |
          if command -v envsubst >/dev/null 2>&1; then
            exit 0
          fi
          sudo=""
          if [[ "$(id -u)" != 0 ]]; then
            sudo="sudo -n"
          fi
          if ! { $sudo apt-get update -qq && $sudo apt-get install -y --no-install-recommends gettext-base; }; then
            echo "::error::envsubst is missing and gettext-base could not be installed; add it to the runner image"
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign v3 writes only the new bundle format and ignores
          # --output-signature/--output-certificate, which sign-blob and
          # verify-release.sh rely on. Stay on v2 until both move to --bundle.
          cosign-release: 'v2.6.5'
      - name: Sign SHA256SUMS (keyless)
        shell: bash
        run: |
          set -euo pipefail
          sums=$(ls release-artifacts/SHA256SUMS-*.txt)
          cosign sign-blob --yes \
            --output-signature "$sums.sig" \
            --output-certificate "$sums.pem" \
            "$sums"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts-signed
          path: release-artifacts/
          if-no-files-found: error

  # Gates publish: the signed checksum file must verify and every artefact in
  # it must match before anything is uploaded. Channel renders (AUR, Homebrew,
  # winget, Flatpak) hang off this job as further steps.
  channels:
    needs: sign
    runs-on: [self-hosted]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts-signed
          path: release-artifacts/
      # cosign-installer runs envsubst, which the self-hosted runners may not have.
      - name: Ensure envsubst is available
        shell: bash
        run: |
          if command -v envsubst >/dev/null 2>&1; then
            exit 0
          fi
          sudo=""
          if [[ "$(id -u)" != 0 ]]; then
            sudo="sudo -n"
          fi
          if ! { $sudo apt-get update -qq && $sudo apt-get install -y --no-install-recommends gettext-base; }; then
            echo "::error::envsubst is missing and gettext-base could not be installed; add it to the runner image"
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign v3 writes only the new bundle format and ignores
          # --output-signature/--output-certificate, which sign-blob and
          # verify-release.sh rely on. Stay on v2 until both move to --bundle.
          cosign-release: 'v2.6.5'
      - name: Ensure osslsigncode is available
        shell: bash
        run: |
          if command -v osslsigncode >/dev/null 2>&1; then
            exit 0
          fi
          sudo=""
          if [[ "$(id -u)" != 0 ]]; then
            sudo="sudo -n"
          fi
          if ! { $sudo apt-get update -qq && $sudo apt-get install -y --no-install-recommends osslsigncode; }; then
            echo "::error::osslsigncode is missing and could not be installed; add it to the runner image"
            exit 1
          fi
      - name: Verify SHA256SUMS signature, artefact digests and Authenticode
        env:
          RUSTTORRENT_AUTHENTICODE_CERT_PEM_B64: ${{ secrets.RUSTTORRENT_AUTHENTICODE_CERT_PEM_B64 }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          test -n "$tag"
          packaging/scripts/verify-release.sh "$tag" release-artifacts
      - name: Render AUR PKGBUILD
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          packaging/scripts/render-aur.sh "$tag" release-artifacts rendered/aur
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-aur
          path: rendered/aur/
          if-no-files-found: error
      - name: Render Homebrew formula
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          packaging/scripts/render-homebrew.sh "$tag" release-artifacts rendered/homebrew
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-homebrew
          path: rendered/homebrew/
          if-no-files-found: error
      - name: Render Flatpak manifest and metainfo
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          packaging/scripts/render-flatpak.sh "$tag" release-artifacts rendered/flatpak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-flatpak
          path: rendered/flatpak/
          if-no-files-found: error
      - name: Render winget manifests
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          packaging/scripts/render-winget.sh "$tag" release-artifacts rendered/winget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-winget
          path: rendered/winget/
          if-no-files-found: error

  publish:
    needs: [build, sign, channels]
    runs-on: [self-hosted, docker, publish]
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.artifacts.outputs.tag }}
      prerelease: ${{ steps.artifacts.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts-signed
          path: release-artifacts/
      - name: Set release tag
        id: artifacts
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          test -n "$tag"
          # Pre-releases (-alpha/-beta/-rc) are GitHub pre-releases and never
          # move the download host's `latest` link, matching container.yml.
          case "$tag" in
            *-alpha*|*-beta*|*-rc*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      # The download host is a mirror; GitHub Releases is the source of
      # truth. An unreachable mirror must not block the release itself.
      - name: Publish download artifacts
        continue-on-error: true
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pinned host key(s) for the download host, one known_hosts line per
          # key. Repo secret; the host key is never learned at run time.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # Dedicated non-root account on the download host. The operator
          # creates it, authorises the key in DEPLOY_SSH_KEY, and makes
          # DEPLOY_DIR writable by it.
          DEPLOY_USER: rusttorrent-deploy
          DEPLOY_HOST: 100.92.4.57
          DEPLOY_DIR: /srv/downloads/rusttorrent
        shell: bash
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          ssh_opts=(-i "$RUNNER_TEMP/ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          tag="${{ steps.artifacts.outputs.tag }}"
          ssh "${ssh_opts[@]}" "$target" "mkdir -p $DEPLOY_DIR/$tag"
          scp "${ssh_opts[@]}" release-artifacts/* "$target:$DEPLOY_DIR/$tag/"
          latest_link=""
          if [[ "${{ steps.artifacts.outputs.prerelease }}" == false ]]; then
            latest_link="&& ln -sfn $tag $DEPLOY_DIR/latest"
          fi
          ssh "${ssh_opts[@]}" "$target" "cd $DEPLOY_DIR/$tag && ln -sfn rtbit-$tag-linux-x86_64 rtbit-linux-x86_64 && ln -sfn rtbit-$tag-windows-x86_64.exe rtbit-windows-x86_64.exe $latest_link"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.artifacts.outputs.tag }}"
          notes="docs/releases/${tag}.md"
          # A checked-in notes file is used verbatim; a tag without one (such
          # as a promoted stable release) gets GitHub-generated notes.
          if test -f "$notes"; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          prerelease_args=()
          if [[ "${{ steps.artifacts.outputs.prerelease }}" == true ]]; then
            prerelease_args=(--prerelease)
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "rustTorrent $tag" "${notes_args[@]}" "${prerelease_args[@]}"
          fi
          gh release upload "$tag" release-artifacts/* --clobber

  # Submits each channel rendered by `channels` once the GitHub release (and so
  # every download URL the renders point at) exists. Stable releases only. A
  # channel whose secret is unset is skipped with a notice; see
  # packaging/scripts/submit-channel.sh for the secrets each one needs.
  submit:
    needs: publish
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: [self-hosted, docker, publish]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: [aur, homebrew, winget, flatpak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: channel-${{ matrix.channel }}
          path: rendered/
      - name: Submit ${{ matrix.channel }}
        env:
          AUR_SSH_KEY: ${{ matrix.channel == 'aur' && secrets.AUR_SSH_KEY || '' }}
          AUR_KNOWN_HOSTS: ${{ matrix.channel == 'aur' && secrets.AUR_KNOWN_HOSTS || '' }}
          HOMEBREW_TAP_TOKEN: ${{ matrix.channel == 'homebrew' && secrets.HOMEBREW_TAP_TOKEN || '' }}
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
          WINGET_TOKEN: ${{ matrix.channel == 'winget' && secrets.WINGET_TOKEN || '' }}
          FLATHUB_TOKEN: ${{ matrix.channel == 'flatpak' && secrets.FLATHUB_TOKEN || '' }}
        shell: bash
        run: packaging/scripts/submit-channel.sh "${{ matrix.channel }}" "${{ needs.publish.outputs.tag }}" rendered
