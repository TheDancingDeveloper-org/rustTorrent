[package]
name = "rusttorrent-fuzz"
version = "0.2.0-beta.4"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bencode = { path = "../crates/librtbit-bencode", package = "swarmforge-bencode" }
peer_binary_protocol = { path = "../crates/librtbit-peer-protocol", package = "swarmforge-peer-protocol" }
dht = { path = "../crates/librtbit-dht", package = "swarmforge-dht" }

[[bin]]
name = "bencode"
path = "fuzz_targets/bencode.rs"
test = false
doc = false

[[bin]]
name = "peer_message"
path = "fuzz_targets/peer_message.rs"
test = false
doc = false

[[bin]]
name = "dht_message"
path = "fuzz_targets/dht_message.rs"
test = false
doc = false
