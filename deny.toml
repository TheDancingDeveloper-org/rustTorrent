# Dependency policy for the complete workspace. Keep CI's cargo-deny version in
# .github/workflows/policy.yml in sync with local verification.

[graph]
all-features = true

[advisories]
ignore = [
    # Accepted 2026-11-02: transitive dependency; upstream migration required.
    { id = "RUSTSEC-2025-0141", reason = "Accepted 2026-11-02: transitive bincode dependency; replace through its upstream consumers." },
    { id = "RUSTSEC-2025-0060", reason = "Accepted 2026-11-02: transitive crypto-hash dependency; replace through its upstream consumer." },
    { id = "RUSTSEC-2024-0436", reason = "Accepted 2026-11-02: transitive paste dependency; replace through its upstream consumers." },
    { id = "RUSTSEC-2024-0370", reason = "Accepted 2026-11-02: transitive proc-macro-error dependency; replace through its upstream consumer." },
    { id = "RUSTSEC-2026-0206", reason = "Accepted 2026-11-02: rustybuzz is supplied by the pinned gpui dependency tree." },
    { id = "RUSTSEC-2026-0192", reason = "Accepted 2026-11-02: ttf-parser is supplied by the pinned gpui dependency tree." },
    { id = "RUSTSEC-2026-0370", reason = "Accepted 2026-11-02: zvariant is transitive through desktop integration crates." },
    { id = "RUSTSEC-2026-0371", reason = "Accepted 2026-11-02: zbus_names is transitive through desktop integration crates." },
    { id = "RUSTSEC-2026-0372", reason = "Accepted 2026-11-02: zvariant_derive is transitive through desktop integration crates." },
    # Accepted 2026-11-02: vulnerable APIs are not called by rustTorrent; update
    # the pinned gpui/desktop dependency trees before removing these entries.
    { id = "RUSTSEC-2026-0385", reason = "Accepted 2026-11-02: ctutils is transitive through gpui and rustTorrent does not use its mask APIs directly." },
    { id = "RUSTSEC-2026-0293", reason = "Accepted 2026-11-02: ringbuf is transitive through gpui and rustTorrent does not call the affected APIs directly." },
    { id = "RUSTSEC-2026-0367", reason = "Accepted 2026-11-02: zip is transitive and rustTorrent does not use ZipArchive extraction." },
    { id = "RUSTSEC-2026-0368", reason = "Accepted 2026-11-02: zip is transitive and rustTorrent does not use ZipArchive extraction." },
    { id = "RUSTSEC-2026-0369", reason = "Accepted 2026-11-02: zip is transitive and rustTorrent does not use ZipArchive extraction." },
    { id = "RUSTSEC-2026-0429", reason = "Accepted 2026-11-02: zip is transitive and rustTorrent does not use ZipArchive extraction." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/thedancingdeveloper/fluent-gpui",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/xim-rs.git",
]
