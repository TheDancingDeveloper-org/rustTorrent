[package]
name = "rtbit-fluent-mockup"
version = "0.2.0-beta.2"
edition = "2024"
description = "Static Fluent 2 (fluent2-egui) mockup of the rustTorrent UI, with fake data and no backend."
license = "Apache-2.0"
repository = "https://github.com/TheDancingDeveloper-org/rustTorrent"
publish = false

[lints]
workspace = true

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
egui = { version = "0.36", default-features = false }
fluent2-egui = { git = "https://github.com/TheDancingDeveloper-org/fluent2-egui", rev = "fddc82911dc3cfe40fea1f6acabd63260239d5a7" }
log = "0.4"

[dev-dependencies]
egui_kittest = "0.36"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
