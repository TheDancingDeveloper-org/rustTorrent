[package]
name = "rtbit-fluent"
version = "0.2.0-beta.5"
authors = ["AusAgentSmith <admin@rusttorrent.dev>"]
edition = "2024"
description = "rustTorrent native client on the fluent-gpui design system (scaffold)."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
gpui = { git = "https://github.com/thedancingdeveloper/fluent-gpui", rev = "940b510d7f9416c9fbd1529dc900900be8eb737e" }
fluent-app = { git = "https://github.com/thedancingdeveloper/fluent-gpui", rev = "940b510d7f9416c9fbd1529dc900900be8eb737e" }
fluent-core = { git = "https://github.com/thedancingdeveloper/fluent-gpui", rev = "940b510d7f9416c9fbd1529dc900900be8eb737e" }
fluent-layout = { git = "https://github.com/thedancingdeveloper/fluent-gpui", rev = "940b510d7f9416c9fbd1529dc900900be8eb737e" }
fluent-primitives = { git = "https://github.com/thedancingdeveloper/fluent-gpui", rev = "940b510d7f9416c9fbd1529dc900900be8eb737e" }
rtbit-client = { path = "../rtbit-client" }
rtbit-ui-core = { path = "../rtbit-ui-core" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
gpui = { git = "https://github.com/thedancingdeveloper/fluent-gpui", rev = "940b510d7f9416c9fbd1529dc900900be8eb737e", features = ["test-support"] }
wiremock = "0.6"
