[package]
name = "swarmforge-core"
version = "0.1.0-rc.5"
edition = "2024"
description = "Core types and utilities for the rtbit BitTorrent client"
license = "Apache-2.0"
repository = "https://github.com/TheDancingDeveloper-org/rustTorrent"
readme = "../SWARMFORGE-README.md"
keywords = ["bittorrent", "torrent", "swarmforge"]
categories = ["network-programming", "data-structures"]

[lib]
name = "librtbit_core"

[features]
default = ["sha1-crypto-hash"]
sha1-crypto-hash = ["sha1w/sha1-crypto-hash"]
sha1-ring = ["sha1w/sha1-ring"]

[dependencies]
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
hex = "0.4"
anyhow = "1"
url = { version = "2", default-features = false }
rand = "0.10"
parking_lot = "0.12"
serde = "1"
serde_derive = "1"
buffers.workspace = true
bencode.workspace = true
clone_to_owned.workspace = true
sha1w = { workspace = true, optional = true }
itertools = "0.15"
directories = "6"
tokio-util = "0.7"
data-encoding = "2"
bytes = "1"
memchr = "2"
thiserror = "2"
chardetng = "1.0"
encoding_rs = "0.8"

[dev-dependencies]
serde_json = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused = "warn"
