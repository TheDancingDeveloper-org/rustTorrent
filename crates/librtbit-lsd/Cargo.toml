[package]
name = "swarmforge-lsd"
version = "0.1.0-rc.4"
edition = "2024"
description = "BEP 14 Local Service Discovery for the rtbit BitTorrent client"
license = "Apache-2.0"
repository = "https://github.com/TheDancingDeveloper-org/rustTorrent"
readme = "../SWARMFORGE-README.md"
keywords = ["bittorrent", "lsd", "swarmforge"]
categories = ["network-programming"]

[lib]
name = "librtbit_lsd"

[features]
default = ["sha1-crypto-hash"]
sha1-crypto-hash = ["sha1w/sha1-crypto-hash"]
sha1-ring = ["sha1w/sha1-ring"]

[dependencies]
anyhow = "1"
librqbit-dualstack-sockets = "0.7"
tokio = { version = "1", features = ["time"] }
tokio-util = "0.7"
sha1w.workspace = true
librtbit-core.workspace = true
rand = "0.10"
futures = "0.3"
bstr = "1"
parking_lot = "0.12"
httparse = "1"
atoi = "3"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused = "warn"
