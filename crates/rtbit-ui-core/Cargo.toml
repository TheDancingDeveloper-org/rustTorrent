[package]
name = "rtbit-ui-core"
version = "0.2.0-beta.4"
authors = ["AusAgentSmith <admin@rusttorrent.dev>"]
edition = "2024"
description = "Toolkit-neutral core of the native rustTorrent client."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
rtbit-client = { path = "../rtbit-client" }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", default-features = false, features = ["rt-async-io-crypto-rust"] }
