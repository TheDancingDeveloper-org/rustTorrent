[package]
name = "rtbit-egui"
version = "0.2.0-beta.4"
authors = ["AusAgentSmith <admin@rusttorrent.dev>"]
edition = "2024"
description = "Native rustTorrent client."
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
# Native file dialog. Off by default so tests and headless CI never open one,
# and so the build does not need a portal or GTK.
file-dialog = ["dep:rfd"]
default = ["keychain"]
# OS keychain. On when a Secret Service (or, later, another platform store) is linked.
keychain = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
fluent2-egui = { git = "https://github.com/TheDancingDeveloper-org/fluent2-egui", tag = "v0.4.2" }
fluent2-icons = { git = "https://github.com/TheDancingDeveloper-org/fluent2-egui", tag = "v0.4.2" }
rtbit-client = { path = "../rtbit-client" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
rfd = { version = "0.16", optional = true, default-features = false, features = ["gtk3"] }

[dev-dependencies]
egui_kittest = "0.37"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", default-features = false, features = ["rt-async-io-crypto-rust"] }
