[package]
name = "rtbit-fluent-mockup"
version.workspace = true
edition = "2024"
publish = false
description = "Static fluent2 mockup of the rustTorrent UI. Fake data, no daemon."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rtbit-fluent-mockup"
path = "src/main.rs"

[[bin]]
name = "rtbit-fluent-mockup-web"
path = "src/wasm.rs"
required-features = ["web"]

[features]
default = []
# Browser entry. Not part of the native binary or the release path.
web = ["dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.37"
# winit enables wayland by default, and this host has no wayland-client.pc.
# x11 is enough for the native mockup window.
winit = { version = "0.30", default-features = false, features = ["x11"] }
fluent2-egui = { git = "https://github.com/TheDancingDeveloper-org/fluent2-egui", tag = "v0.4.1" }
fluent2-icons = { git = "https://github.com/TheDancingDeveloper-org/fluent2-egui", tag = "v0.4.1" }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
